name: Release

# Builds a self-contained executable per platform with PyInstaller and
# attaches each to a GitHub Release, so anyone (no Python/pygame install
# needed) can just download and run the game. Triggered by pushing a
# version tag (v*), or manually from the Actions tab for a one-off test
# build (uploaded as a workflow artifact instead, since there's no tag to
# attach a release asset to).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false  # one platform's build breaking shouldn't block the others
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: in-a-big-forest-linux-x86_64.tar.gz
            binary_name: in-a-big-forest
            data_sep: ":"
            archive: tar
          - os: windows-latest
            asset_name: in-a-big-forest-windows-x86_64.zip
            binary_name: in-a-big-forest.exe
            data_sep: ";"
            archive: zip
          - os: macos-latest
            # GitHub's macos-latest runners are Apple Silicon — this won't
            # run on an older Intel Mac without also adding a macos-13 leg
            asset_name: in-a-big-forest-macos-arm64.zip
            binary_name: in-a-big-forest
            data_sep: ":"
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # also available on windows-latest (Git Bash), so one script works everywhere
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build onefile executable
        run: |
          pyinstaller --onefile --name in-a-big-forest --add-data "assets${{ matrix.data_sep }}assets" game.py

      - name: Package (tar preserves the executable bit; zip is what Windows/macOS users expect)
        run: |
          if [ "${{ matrix.archive }}" = "tar" ]; then
            tar -C dist -czf "${{ matrix.asset_name }}" "${{ matrix.binary_name }}"
          else
            (cd dist && zip "../${{ matrix.asset_name }}" "${{ matrix.binary_name }}")
          fi

      - name: Smoke test the binary launches
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy "./dist/${{ matrix.binary_name }}" &
          pid=$!
          sleep 5
          if kill -0 $pid 2>/dev/null; then
            echo "still running after 5s - good"
            kill $pid
          else
            wait $pid
            echo "game exited early with code $?"
            exit 1
          fi

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}

      - name: Upload workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
